name: Release

# Runs when `npm run release` pushes a vX.Y.Z tag: builds the macOS app, attaches the DMG, the
# zip (used by the in-app updater) and SHA256SUMS.txt (which the updater verifies) to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # `npm run release -- --local` publishes from a Mac; then there's nothing to build here.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.existing.outputs.published }}
    steps:
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to build."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The web server tests run a real PHP backend.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build the app
        run: npm run dist

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "Spindle Make ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
